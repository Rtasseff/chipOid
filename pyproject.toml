[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chipoid"
version = "0.9.0.dev1"
description = "Classical-CV well detection and fluorescence readout for microfluidic chip overview images"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-image>=0.21",
    "tifffile>=2023.0",
    "imagecodecs>=2023.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
]
# Build-time deps for the Windows GUI bundle. Tkinter itself is stdlib (shipped
# with the official Python installer on Windows). See docs/WINDOWS_DESKTOP_BUNDLE.md.
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
chipoid = "chipoid.cli:main"
chipoid-gui = "chipoid.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chipoid*"]
